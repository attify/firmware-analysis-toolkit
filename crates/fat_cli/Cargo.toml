[package]
name = "firmware-analysis-toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "FAT — command-line firmware analysis toolkit"
publish = false

# Only the CLI owns the product tag and non-Cargo version fields.
[package.metadata.release]
tag = true
pre-release-replacements = [
    { file = "../../share/fat/manifest.json", search = '"data_version": "[^"]+"', replace = '"data_version": "{{version}}"', exactly = 1, prerelease = true },
    { file = "../../share/fat/manifest.json", search = '"compatible_fat": "[^"]+"', replace = '"compatible_fat": "={{version}}"', exactly = 1, prerelease = true },
    { file = "../../CITATION.cff", search = '(?m)^version: "[^"]+"$', replace = 'version: "{{version}}"', exactly = 1, prerelease = true },
    { file = "../../README.md", search = 'git clone --branch v[^ ]+ --depth 1', replace = 'git clone --branch v{{version}} --depth 1', exactly = 1 },
]

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
fat_analyze = { version = "=2.0.0", path = "../fat_analyze", package = "fat-toolkit-analyze" }
fat_backend = { version = "=2.0.0", path = "../fat_backend", package = "fat-toolkit-backend" }
fat_bootloader = { version = "=2.0.0", path = "../fat_bootloader", package = "fat-toolkit-bootloader" }
fat_family = { version = "=2.0.0", path = "../fat_family", package = "fat-toolkit-family" }
fat_extract = { version = "=2.0.0", path = "../fat_extract", package = "fat-toolkit-extract" }
fat_package = { version = "=2.0.0", path = "../fat_package", package = "fat-toolkit-package" }
fat_core = { version = "=2.0.0", path = "../fat_core", package = "fat-toolkit-core" }
fat_emulate = { version = "=2.0.0", path = "../fat_emulate", package = "fat-toolkit-emulate" }
fat_taint = { version = "=2.0.0", path = "../fat_taint", package = "fat-toolkit-taint" }
fat_plugin_api = { version = "=2.0.0", path = "../fat_plugin_api", package = "fat-toolkit-plugin-api" }
fat_plugin_host = { version = "=2.0.0", path = "../fat_plugin_host", package = "fat-toolkit-plugin-host" }
fat_query = { version = "=2.0.0", path = "../fat_query", package = "fat-toolkit-query" }
r2pipe = "0.8.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
lzma-rs = "0.3"
xz2 = "0.1"
owo-colors = "4"
zip = "2"
tar = "0.4"
indicatif = { version = "0.17", default-features = false }
libc = "0.2"

[dev-dependencies]
crc32fast = "1"
serde_yaml = "0.9"
# Integration tests under tests/integration/ are registered as fat_cli test
# targets, so the fixture loaders they use are enabled here rather than in
# fat_query's default features.
fat_query = { version = "=2.0.0", path = "../fat_query", package = "fat-toolkit-query", features = ["test-fixtures"] }
flate2 = "1"
tempfile = "3"
zip = "2"

